# Ruff — единый линтер и форматтер
line-length = 90
target-version = "py312"

[lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
]
ignore = [
    "E501",  # line too long (форматтер сам решает)
]

[lint.isort]
known-first-party = ["src", "config", "bot_instance", "logging_setup"]
